<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="hero">
      <header class="header-top">
        <a href="#"><img src="./img/logo.svg" alt="Netflix" /></a>
        <button>Sign In</button>
      </header>
      <main class="main-hero">
        <h1>
          Plot twist: New hits, <br />
          every single week
        </h1>
        <p>Starts at ₦2,500. Cancel anytime.</p>
        <h3>
          Ready to watch? Enter your email to create or restart your membership.
        </h3>
        <div class="main-hero_input">
          <input type="text" placeholder="Email address" />
          <button>Get Started <i class="fa-solid fa-angle-right"></i></button>
        </div>
      </main>
    </div>

    <section class="movie-poster">
      <h1>Tending now</h1>
      <div class="parent__image-box">
        <div class="image-box">
          <img src="./img/poster1.jpg" alt="" srcset="" />
          <span>1</span>
        </div>
        <div class="image-box">
          <img src="./img/poster1.jpg" alt="" srcset="" />
          <span>2</span>
        </div>
        <div class="image-box">
          <img src="./img/poster1.jpg" alt="" srcset="" />
          <span>3</span>
        </div>
        <div class="image-box">
          <img src="./img/poster1.jpg" alt="" srcset="" />
          <span>4</span>
        </div>
        <div class="image-box">
          <img src="./img/poster1.jpg" alt="" srcset="" />
          <span>5</span>
        </div>
      </div>
    </section>
  </body>
</html>
